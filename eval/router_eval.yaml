# Router eval set — Phase 1.3
#
# Hand-labeled queries for measuring cascade-router accuracy. Each row is a
# realistic-shaped user query plus the gold-label `expected_category`. The
# runner (scripts/run_router_eval.py) runs every query through the cascade
# and reports per-tier hit rate, per-category misroute rate, and latency.
#
# Locked category set (see memory/project_router_phase1_decisions.md):
#
#   fast-qa         → claude-haiku-4-5     (short factual, lookups, brief summaries)
#   code            → claude-sonnet-4-6    (coding, debugging, refactors)
#   deep-reasoning  → claude-opus-4-7      (multi-step reasoning, architecture)
#   long-context    → claude-opus-4-7      (large attached documents — orthogonal axis)
#
# Composition (Phase 1.3 sign-off):
#   - 67 queries: 17 fast-qa, 17 code, 17 deep-reasoning, 16 long-context
#   - Hand-built to be disjoint from config/router_exemplars.yaml (data leakage)
#   - Each batch authored separately and individually signed off by the user
#   - A polarity-edge query per category exercises the tier-2 polarity-flip check
#   - sha256 collision check vs the exemplar corpus is part of the runner
#
# Eval ≠ exemplars (see research/phase_1_3_eval_set.md):
#   - exemplars *decide* routes at runtime (tier-2 NN lookup target)
#   - this file *measures* router quality
#   - If a query exists in both, the router trivially self-matches at 100% →
#     data leakage. Keep them disjoint.

queries:
  # ---------------------------------------------------------------------------
  # fast-qa — short factual lookups, definitions, conversions, brief rewrites
  # ---------------------------------------------------------------------------

  - query: "What's the population of Iceland?"
    expected_category: fast-qa
    notes: "Direct factual lookup; hits tier-1 heuristic"

  - query: "Define entropy in one sentence."
    expected_category: fast-qa
    notes: "Definition, tight bound"

  - query: "Convert 100 km/h to mph."
    expected_category: fast-qa
    notes: "Unit conversion, no question word — likely falls through to tier 2/3"

  - query: "Who painted the Mona Lisa?"
    expected_category: fast-qa
    notes: "Authorship lookup"

  - query: "What does CPU stand for?"
    expected_category: fast-qa
    notes: "Acronym expansion"

  - query: "What year did the Berlin Wall fall?"
    expected_category: fast-qa
    notes: "Date question"

  - query: "Translate 'thank you' to French."
    expected_category: fast-qa
    notes: "Short translation; hits tier-1"

  - query: "Is broccoli a flower?"
    expected_category: fast-qa
    notes: "Quick yes/no-ish; no heuristic head — tier 2/3"

  - query: "List the planets in order from the sun."
    expected_category: fast-qa
    notes: "Brief enumeration"

  - query: "What's the freezing point of mercury?"
    expected_category: fast-qa
    notes: "Constant lookup"

  - query: "How tall is Mount Everest in meters?"
    expected_category: fast-qa
    notes: "Magnitude lookup"

  - query: "What's the default port for PostgreSQL?"
    expected_category: fast-qa
    notes: "Tech lookup — could pull toward code; pressure test"

  - query: "Spell-check: 'Wensday's meeting was canceled.'"
    expected_category: fast-qa
    notes: "Surface correction, no heuristic head"

  - query: "Rephrase to be shorter: 'Due to the circumstances surrounding the matter, we have concluded postponement is necessary.'"
    expected_category: fast-qa
    notes: "Light rewrite"

  - query: "Give me a one-sentence TL;DR of why the Roman Empire fell."
    expected_category: fast-qa
    notes: "TL;DR signal on a topic that could pull deep-reasoning"

  - query: "Capital of New Zealand?"
    expected_category: fast-qa
    notes: "Sentence fragment, no heuristic head — tier 2/3"

  - query: "What's git rebase in one sentence?"
    expected_category: fast-qa
    notes: "POLARITY EDGE — coding topic, brief-answer framing keeps it fast-qa"

  # ---------------------------------------------------------------------------
  # code — writing code, debugging, refactoring, build/tooling, CI
  # ---------------------------------------------------------------------------

  - query: "Write a Bash one-liner to find all files larger than 100MB in /var/log."
    expected_category: code
    notes: "Hits tier-1: 'write … one-liner' + path; tests heuristic"

  - query: "Implement a debounce function in JavaScript."
    expected_category: code
    notes: "Generation; hits tier-1 verb pattern"

  - query: |
      Refactor this to use a list comprehension:

      result = []
      for x in items:
          if x > 0:
              result.append(x * 2)
    expected_category: code
    notes: "Code body inline; tests refactor signal"

  - query: |
      Why does my Rust async function never resolve?

      async fn fetch() {
          tokio::spawn(async { do_work().await });
      }
    expected_category: code
    notes: "Debugging without stack trace; code body present"

  - query: "Convert this curl command to a Python requests call: curl -X POST https://api.example.com/users -H 'Content-Type: application/json' -d '{\"name\":\"alice\"}'"
    expected_category: code
    notes: "Cross-tool translation; tier-1 verb"

  - query: "Add error handling to this function: def divide(a, b): return a / b"
    expected_category: code
    notes: "Inline code in prose"

  - query: "Write a SQL query to find users who haven't logged in for the last 30 days."
    expected_category: code
    notes: "SQL generation"

  - query: |
      There's a bug in my React useEffect — it runs on every render. What did I do wrong?

      useEffect(() => { fetchData(); })
    expected_category: code
    notes: "Bug diagnosis with code snippet"

  - query: "Generate a GitHub Actions workflow that runs pytest on every PR."
    expected_category: code
    notes: "CI artifact generation"

  - query: "Audit this Express route for OWASP top-10 issues: app.get('/user/:id', (req, res) => db.query('SELECT * FROM users WHERE id=' + req.params.id, (e, r) => res.json(r)))"
    expected_category: code
    notes: "Code review — multiple vulns (SQLi, callback)"

  - query: "Write a regex for parsing semver tags like v1.2.3-rc.1+build.42."
    expected_category: code
    notes: "Regex generation"

  - query: "How do I set up structured logging in a Spring Boot app?"
    expected_category: code
    notes: "Multi-modal edge — 'how do I' feels fast-qa but answer is config code"

  - query: "My alembic migration is failing with 'column already exists' — what's likely wrong?"
    expected_category: code
    notes: "Debugging without trace; no heuristic head"

  - query: "Write a Jest test that mocks fetch and asserts the URL it was called with."
    expected_category: code
    notes: "Test generation"

  - query: "Help me set up a pre-commit hook that runs ruff and mypy on staged Python files."
    expected_category: code
    notes: "Tooling/setup; tier-1 may miss — no explicit 'function/script/class' noun"

  - query: "Explain in plain English what this Python decorator does — no code edits needed: @lru_cache(maxsize=128)"
    expected_category: code
    notes: "POLARITY EDGE — 'plain English, no code edits' framing but still a code task"

  - query: |
      Port this Python script to Go:

      for line in open('log.txt'):
          if 'ERROR' in line:
              print(line)
    expected_category: code
    notes: "Cross-language port with .py file ref → tier-1 structural"

  # ---------------------------------------------------------------------------
  # deep-reasoning — multi-step reasoning, architecture, planning, derivations
  # ---------------------------------------------------------------------------

  - query: "Walk me through why CAP theorem doesn't actually force a binary choice in practice — what nuance do most explanations miss?"
    expected_category: deep-reasoning
    notes: "Conceptual reasoning, 'walk me through' signal"

  - query: "We need to pick between Postgres and DynamoDB for a multi-region SaaS with strong-consistency requirements. Reason through it."
    expected_category: deep-reasoning
    notes: "Decision with stated constraint"

  - query: "Prove that the halting problem is undecidable."
    expected_category: deep-reasoning
    notes: "Proof; hits tier-1 'prove' pattern"

  - query: "Three rooms, three light switches, one bulb each, but you can only enter the rooms once. How do you figure out which switch controls which bulb? Show your reasoning."
    expected_category: deep-reasoning
    notes: "Classic puzzle, 'show your reasoning' signal"

  - query: "Our checkout funnel converts at 2.3% on desktop and 0.8% on mobile. Before we A/B-test anything, reason through what data we'd collect to form a real hypothesis."
    expected_category: deep-reasoning
    notes: "Numerical input, reasoning before action"

  - query: "Should our team adopt a monorepo? We have 5 services, 3 frontends, and 14 engineers. Walk me through the tradeoffs and what would tip the decision."
    expected_category: deep-reasoning
    notes: "Decision under team constraints"

  - query: "Compare leader-based vs leaderless replication for a write-heavy metrics ingest pipeline. Which is the better fit and why?"
    expected_category: deep-reasoning
    notes: "Architectural comparison"

  - query: "Derive from first principles why quicksort's expected number of comparisons with random pivot selection is O(n log n)."
    expected_category: deep-reasoning
    notes: "Algorithmic derivation; same template as merge-sort exemplar, novel content"

  - query: "Plan a phased rollout for switching our auth provider from Auth0 to self-hosted Keycloak with zero downtime — account for refresh-token compatibility."
    expected_category: deep-reasoning
    notes: "Rollout planning with constraint; 'account for' signal"

  - query: "Reason through whether feature flags should be our primary deployment mechanism or whether we stick with branching strategies. Team is 8 backend devs shipping daily."
    expected_category: deep-reasoning
    notes: "Decision with team constraint"

  - query: "Why is exactly-once delivery in message queues a misleading marketing term? Walk through the underlying impossibility argument."
    expected_category: deep-reasoning
    notes: "Conceptual reasoning, anti-fast-qa framing"

  - query: "If we cut our cache TTL from 60s to 5s, walk through what happens to backend QPS — and call out the non-obvious second-order effects."
    expected_category: deep-reasoning
    notes: "What-if reasoning with explicit 'non-obvious' signal"

  - query: "Analyze the tradeoffs between vertical and horizontal scaling for our search index — currently 4TB, growing 50GB/week."
    expected_category: deep-reasoning
    notes: "Tradeoff analysis with quantitative growth"

  - query: "Don't list the tradeoffs — recommend whether we should rewrite this Ruby on Rails service in Go."
    expected_category: deep-reasoning
    notes: "POLARITY EDGE near locking-tradeoff negation pair; expects tier-2 polarity flip → tier-3"

  - query: "A 35-year-old reports recurring chest pain on exertion that resolves with rest. Reason through the differential and what you'd want to rule out first."
    expected_category: deep-reasoning
    notes: "Medical differential reasoning"

  - query: "Should we use OAuth2 device flow or PKCE for our CLI tool? Argue for one given a 90/10 desktop/headless user split."
    expected_category: deep-reasoning
    notes: "Auth design decision with usage-split constraint"

  - query: "Walk me through whether eventual consistency is acceptable for a banking 'recent transactions' view — and under what specific conditions it isn't."
    expected_category: deep-reasoning
    notes: "Conditional reasoning with constraint flip"

  # ---------------------------------------------------------------------------
  # long-context — operations OVER large attached/pasted documents
  # ---------------------------------------------------------------------------

  - query: "I'm pasting our entire engineering wiki below — find every page that mentions deprecated APIs and list them with the section heading."
    expected_category: long-context
    notes: "Whole-corpus semantic scan"

  - query: "Here are 8 customer support ticket transcripts from last quarter. What are the top recurring root causes?"
    expected_category: long-context
    notes: "Multi-document thematic synthesis"

  - query: "Below is the full text of a 60-page lease agreement. List every monetary obligation and when it's due."
    expected_category: long-context
    notes: "Long doc structured extraction"

  - query: "I'm attaching our 200MB git log as a file — identify the commits that touched the auth module and summarize what changed."
    expected_category: long-context
    notes: "Large blob filter + summarize"

  - query: "Read this 100-page user research report and pull out every quote where users describe being confused by the checkout flow."
    expected_category: long-context
    notes: "Long doc quote extraction"

  - query: "Compare these two 40-page API specs side by side and tell me which endpoints changed shape between versions."
    expected_category: long-context
    notes: "Long doc cross-version diff"

  - query: "Given the full transcript of yesterday's 90-minute all-hands, extract every commitment the CEO made with timestamps."
    expected_category: long-context
    notes: "Long transcript entity extraction"

  - query: "I'm pasting our entire SQL schema for a 200-table data warehouse — find every table missing a created_at column."
    expected_category: long-context
    notes: "Long schema filter"

  - query: "Take this 250-page novel and identify all the chapters where the antagonist appears."
    expected_category: long-context
    notes: "Long literary corpus enumeration"

  - query: "Below is a 500-comment GitHub issue thread. Synthesize the actual technical resolution from the noise."
    expected_category: long-context
    notes: "Long thread synthesis"

  - query: "I've attached our company's full onboarding handbook. Summarize what's expected of a new hire in their first two weeks."
    expected_category: long-context
    notes: "Long doc pinpoint Q&A"

  - query: "Here are 15 partner contracts as one bundle. Extract every termination clause and list each by partner."
    expected_category: long-context
    notes: "Multi-document clause extraction"

  - query: "Read this multi-hour podcast transcript and find every claim the host made that a guest contradicted later in the episode."
    expected_category: long-context
    notes: "Long transcript intra-document contradiction detection"

  - query: "Diff these two large config bundles I'm pasting and flag which changes are likely to affect production."
    expected_category: long-context
    notes: "Long config diff + judgment"

  - query: "Below is a 100-file codebase dump for one microservice. Identify every cross-service call and group them by destination."
    expected_category: long-context
    notes: "Long codebase scan — multi-modal edge (code topic, long-context shape)"

  - query: "Skip the attached agenda — what's the venue address for tomorrow's meeting?"
    expected_category: fast-qa
    notes: "POLARITY EDGE — long-context negation pair B shape; user wants fast-qa lookup, polarity flip should fall through"
